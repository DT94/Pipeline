name: Pipeline Inquebrantable

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar Proyecto y Escanear
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para que SonarCloud analice el historial completo

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Empaquetar aplicación
        run: mvn clean package -DskipTests

      # --- CAPA SAST: SonarCloud ---
      - name: Analizar código con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=dt94_Pipeline -Dsonar.organization=dt94 -Dsonar.host.url=https://sonarcloud.io

      # --- CAPA SCA: Snyk ---
      - name: Escanear dependencias con Snyk
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high