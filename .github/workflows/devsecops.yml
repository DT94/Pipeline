name: Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar Proyecto y Escanear
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Empaquetar aplicación
        run: mvn clean package -DskipTests

      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=DT94_Pipeline
            -Dsonar.organization=dt94
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.java.binaries=target/classes

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Escanear dependencias con Snyk
        env:
         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high -d




      - name: Escanear contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
            image-ref: 'backend-api:latest'
            format: 'table'
            exit-code: '1'
            ignore-unfixed: true
            severity: 'CRITICAL,HIGH'
            continue-on-error: true